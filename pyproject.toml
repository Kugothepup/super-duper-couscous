[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crp"
version = "0.1.0"
description = "Community research pipeline: the code that counts."
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "rapidfuzz==3.14.6",
    "krippendorff==0.8.2",
    "scipy==1.18.1",
    "Jinja2==3.1.6",
    "scikit-learn==1.9.1",
    "threadpoolctl==3.7.0",
    "python-docx==1.2.0",
    "pytest==9.1.1",
]

[project.optional-dependencies]
ocr = ["pytesseract==0.3.13", "Pillow==12.3.0"]

[tool.setuptools]
packages = ["crp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
